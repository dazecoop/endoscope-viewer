<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endoscope">
<meta name="theme-color" content="#0b0f0e">
<title>Endoscope Viewer</title>
<style>
  /* Palette: near-black stage, warm teal accent (instrument feel), amber capture */
  :root{
    --bg:#0b0f0e; --panel:#151b1a; --panel-2:#1f2624; --line:#2a3331;
    --fg:#eef3f1; --muted:#8fa09b; --accent:#2dd4bf; --accent-press:#14b8a6;
    --amber:#f5b041; --danger:#f87171;
    --btn:#1d2625; --btn-press:#2a3634;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:15px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* top: centred title with the camera picker beneath it */
  #top{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent);}
  #title{font-weight:700;letter-spacing:.3px;font-size:17px;text-align:center;}
  #title b{color:var(--accent);}
  select#cam{max-width:min(82%,360px);appearance:none;text-align:center;text-align-last:center;
    background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;}

  /* stage — the feed fills the full width at any window size */
  #stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
  #view{width:100%;height:auto;display:block;background:#000;}
  video#src{position:absolute;width:2px;height:2px;opacity:.01;top:0;left:0;pointer-events:none;}

  /* start overlay */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 40%,#122020,#000);text-align:center;padding:24px;}
  #start p{color:var(--muted);max-width:300px;margin:0;}
  #startBtn{appearance:none;border:0;border-radius:16px;padding:18px 32px;font-size:18px;font-weight:700;
    color:#06211d;background:var(--accent);box-shadow:0 8px 30px rgba(45,212,191,.35);}
  #startBtn:active{background:var(--accent-press);}
  #err{color:var(--danger);font-size:14px;max-width:320px;min-height:1.2em;}

  /* adjust panel */
  #adjust{position:absolute;left:0;right:0;bottom:0;transform:translateY(110%);transition:transform .22s ease;
    background:var(--panel);border-top:1px solid var(--line);
    padding:14px calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 16px);
    display:flex;flex-direction:column;gap:12px;z-index:6;}
  #adjust.open{transform:translateY(0);}
  .row{display:flex;align-items:center;gap:12px;}
  .row label{width:84px;color:var(--muted);font-size:13px;flex:0 0 auto;}
  .row input[type=range]{flex:1;accent-color:var(--accent);height:28px;}
  .row .val{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg);font-size:13px;}
  #adjust .head{display:flex;align-items:center;justify-content:space-between;}
  #adjust .head span{font-weight:600;}
  .linkbtn{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;padding:6px;}

  /* bottom controls */
  .bar{flex:0 0 auto;display:flex;gap:8px;z-index:5;
    padding:10px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px);
    background:linear-gradient(to top,rgba(0,0,0,.55),transparent);}
  .btn{position:relative;flex:1;appearance:none;border:0;border-radius:14px;padding:13px 6px;background:var(--btn);color:var(--fg);
    font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
  .btn:active{background:var(--btn-press);}
  .btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .btn.snap{background:var(--amber);color:#1a1200;}
  .btn.snap svg{stroke:#1a1200;}
  .btn.snap:active{background:#e0982e;}
  .btn.on{background:var(--accent);color:#06211d;}
  .badge{position:absolute;top:5px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);
    color:#1a1200;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;}
  .badge.show{display:flex;}

  /* capture flash + feedback */
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .35s ease;}
  #flash.go{opacity:.8;transition:none;}

  /* gallery — top bar and controls mirror the main page */
  #gallery{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;}
  #gallery.open{display:flex;}
  #galTop{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent);}
  #galTitle{font-weight:700;letter-spacing:.3px;font-size:17px;text-align:center;}
  #galGrid{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start;
    padding:12px calc(env(safe-area-inset-right,0px)+12px) 12px calc(env(safe-area-inset-left,0px)+12px);}
  .thumb{padding:0;border:0;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .galempty{grid-column:1/-1;color:var(--muted);text-align:center;padding:48px 16px;line-height:1.5;}

  /* single-image viewer */
  #viewer{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.96);display:none;flex-direction:column;}
  #viewer.open{display:flex;}
  #viewerImg{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;
    -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;
    padding:calc(env(safe-area-inset-top,0px)+8px) 8px 8px;}

  /* shared control-bar button modifiers */
  .btn.primary{background:var(--accent);color:#06211d;}
  .btn.primary svg{stroke:#06211d;}
  .btn.danger svg{stroke:var(--danger);}

  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);
    background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:45;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="title">Endo<b>scope</b></div>
    <select id="cam" aria-label="Camera source"></select>
  </div>

  <div id="stage">
    <video id="src" playsinline autoplay muted></video>
    <canvas id="view"></canvas>
    <div id="start">
      <div style="font-size:40px">🔎</div>
      <p>Plug the endoscope into the iPad's USB-C port, then tap to begin.</p>
      <button id="startBtn">Start camera</button>
      <div id="err"></div>
    </div>

    <div id="adjust">
      <div class="head"><span>Image</span><button class="linkbtn" id="resetAdj">Reset</button></div>
      <div class="row"><label>Brightness</label><input type="range" id="bri" min="50" max="200" value="100"><span class="val" id="briV">100%</span></div>
      <div class="row"><label>Contrast</label><input type="range" id="con" min="50" max="200" value="100"><span class="val" id="conV">100%</span></div>
      <div class="row"><label>Saturation</label><input type="range" id="sat" min="0" max="200" value="100"><span class="val" id="satV">100%</span></div>
    </div>
  </div>

  <div id="bar" class="bar">
    <button class="btn" id="rotBtn">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v4h-4"/></svg>Rotate</button>
    <button class="btn" id="mirBtn">
      <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M7 7l-4 5 4 5"/><path d="M17 7l4 5-4 5"/></svg>Mirror</button>
    <button class="btn" id="adjBtn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Adjust</button>
    <button class="btn snap" id="snapBtn">
      <svg viewBox="0 0 24 24"><path d="M5 7h3l1.5-2h5L16 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg>Snapshot</button>
    <button class="btn" id="galBtn">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 5"/><circle cx="8.5" cy="9.5" r="1.3"/></svg>Gallery
      <span class="badge" id="galBadge">0</span></button>
  </div>
</div>

<div id="flash"></div>

<!-- gallery -->
<div id="gallery">
  <div id="galTop"><div id="galTitle">Captures</div></div>
  <div id="galGrid"></div>
  <div class="bar">
    <button class="btn" id="galBack">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
    <button class="btn primary" id="saveAll">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save all</button>
    <button class="btn danger" id="clearAll">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg><span class="lbl">Clear</span></button>
  </div>
</div>

<!-- single image viewer -->
<div id="viewer">
  <img id="viewerImg" alt="capture">
  <div class="bar">
    <button class="btn" id="vBack">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
    <button class="btn primary" id="vSave">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save</button>
    <button class="btn danger" id="vDelete">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>Delete</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var video = document.getElementById('src');
  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d');
  var camSel = document.getElementById('cam');
  var startOv = document.getElementById('start');
  var errEl = document.getElementById('err');

  var BUILTIN = /front|back|facetime|truedepth|ultra\s*wide|telephoto|desk\s*view/i;
  var LS = 'endoscope.v1';

  var state = { deviceId:null, rot:0, mir:false, bri:100, con:100, sat:100 };
  try { Object.assign(state, JSON.parse(localStorage.getItem(LS)||'{}')); } catch(e){}

  var stream=null, raf=0, running=false, wakeLock=null;
  var shotCount=0, actx=null, seq=0, curShot=null, galUrls=[];

  function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1500); }

  function filterStr(){ return 'brightness('+state.bri+'%) contrast('+state.con+'%) saturate('+state.sat+'%)'; }
  function applyAdjust(){ canvas.style.filter = filterStr(); }

  // ===== store (IndexedDB, with in-memory fallback) =====
  var useMem=false, mem=[];
  function idb(){ return new Promise(function(res,rej){
    var r=indexedDB.open('endoscope',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('shots',{keyPath:'id'}); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  }); }
  function tx(mode,fn){ return idb().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction('shots',mode), st=t.objectStore('shots'), out=fn(st);
    t.oncomplete=function(){ res(out&&out.result!==undefined?out.result:undefined); };
    t.onerror=function(){ rej(t.error); };
  }); }); }
  async function sPut(rec){ if(useMem){ mem.push(rec); return; } try{ await tx('readwrite',function(s){ s.put(rec); }); }catch(e){ useMem=true; mem.push(rec); } }
  async function sAll(){ if(useMem) return mem.slice(); try{ return await tx('readonly',function(s){ return s.getAll(); }); }catch(e){ useMem=true; return mem.slice(); } }
  async function sDel(id){ if(useMem){ mem=mem.filter(function(r){return r.id!==id;}); return; } try{ await tx('readwrite',function(s){ s.delete(id); }); }catch(e){ useMem=true; mem=mem.filter(function(r){return r.id!==id;}); } }
  async function sClear(){ if(useMem){ mem=[]; return; } try{ await tx('readwrite',function(s){ s.clear(); }); }catch(e){ useMem=true; mem=[]; } }

  function updateBadge(){ var b=document.getElementById('galBadge'); b.textContent=shotCount; b.classList.toggle('show', shotCount>0); }

  // ===== render loop (rotation / mirror; colour via CSS filter) =====
  function draw(){
    raf = requestAnimationFrame(draw);
    if (video.readyState < 2 || !video.videoWidth) return;
    var vw=video.videoWidth, vh=video.videoHeight;
    var rotated = (state.rot % 180) !== 0;
    var cw = rotated ? vh : vw, ch = rotated ? vw : vh;
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    ctx.save();
    ctx.translate(cw/2, ch/2);
    ctx.rotate(state.rot * Math.PI/180);
    ctx.scale(state.mir ? -1 : 1, 1);
    ctx.drawImage(video, -vw/2, -vh/2, vw, vh);
    ctx.restore();
  }

  // ===== camera =====
  async function listCams(){
    var devs = await navigator.mediaDevices.enumerateDevices();
    var cams = devs.filter(function(d){ return d.kind==='videoinput'; });
    camSel.innerHTML='';
    cams.forEach(function(d,i){
      var o=document.createElement('option'); o.value=d.deviceId;
      o.textContent = d.label || ('Camera '+(i+1)); camSel.appendChild(o);
    });
    return cams;
  }
  function pickDefault(cams){
    if (state.deviceId && cams.some(function(c){return c.deviceId===state.deviceId;})) return state.deviceId;
    var ext = cams.find(function(c){ return c.label && !BUILTIN.test(c.label); });
    if (ext) return ext.deviceId;
    return cams.length ? cams[cams.length-1].deviceId : null;
  }
  async function open(deviceId){
    if (stream) stream.getTracks().forEach(function(t){t.stop();});
    var constraints = { audio:false, video: deviceId
        ? { deviceId:{ exact: deviceId }, width:{ideal:1280}, height:{ideal:720} }
        : { width:{ideal:1280}, height:{ideal:720} } };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play().catch(function(){});
    var tr = stream.getVideoTracks()[0];
    if (tr && tr.getSettings){ var s=tr.getSettings(); if (s.deviceId) { state.deviceId=s.deviceId; save(); } }
    if (camSel.value !== state.deviceId) camSel.value = state.deviceId || '';
  }
  async function startFlow(){
    errEl.textContent='';
    try{
      initAudio();
      await open(state.deviceId);
      var cams = await listCams();
      var want = pickDefault(cams);
      if (want && want !== state.deviceId){ await open(want); }
      camSel.value = state.deviceId || (cams[0]&&cams[0].deviceId) || '';
      running = true;
      startOv.style.display='none';
      applyAdjust();
      cancelAnimationFrame(raf); draw();
      keepAwake();
      sAll().then(function(a){ shotCount=a.length; updateBadge(); });
    }catch(e){ errEl.textContent = describeErr(e); }
  }
  function describeErr(e){
    if(!e) return 'Could not start the camera.';
    if(e.name==='NotAllowedError') return 'Camera permission was denied. Allow it in Settings and reload.';
    if(e.name==='NotFoundError') return 'No camera found. Is the endoscope plugged into the USB-C port?';
    if(e.name==='NotReadableError') return 'The camera is busy or unavailable. Unplug/replug the scope and reload.';
    return (e.name||'Error')+': '+(e.message||'could not start camera');
  }

  // ===== wake lock =====
  async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){} }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && running){
      keepAwake();
      if(actx && actx.state==='suspended') actx.resume().catch(function(){});
      if(stream){ var tr=stream.getVideoTracks()[0];
        if(!tr || tr.readyState==='ended'){ open(state.deviceId).catch(function(){}); }
        video.play().catch(function(){}); }
    }
  });

  // ===== capture feedback =====
  function initAudio(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  function beep(){ if(!actx) return; try{
    if(actx.state==='suspended') actx.resume();
    var o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=880;
    o.connect(g); g.connect(actx.destination);
    var t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.start(t); o.stop(t+0.15);
  }catch(e){} }
  function flash(){ var f=document.getElementById('flash'); f.classList.add('go');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ f.classList.remove('go'); }); }); }

  function clampByte(v){ return v<0?0:v>255?255:v; }
  function stamp(){ var d=new Date(),p=function(n){return(n<10?'0':'')+n;};
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }

  // ===== snapshot: instant capture into the gallery (no dialog) =====
  function snapshot(){
    if(!running || !canvas.width){ return; }
    flash(); beep();
    var ex = document.createElement('canvas'); ex.width=canvas.width; ex.height=canvas.height;
    var ex2 = ex.getContext('2d'); ex2.drawImage(canvas,0,0);
    if(state.bri!==100 || state.con!==100 || state.sat!==100){
      try{
        var im=ex2.getImageData(0,0,ex.width,ex.height), d=im.data;
        var b=state.bri/100, c=state.con/100, s=state.sat/100;
        for(var i=0;i<d.length;i+=4){
          var r=d[i]*b, g=d[i+1]*b, bl=d[i+2]*b;
          r=(r-128)*c+128; g=(g-128)*c+128; bl=(bl-128)*c+128;
          var gray=0.299*r+0.587*g+0.114*bl;
          d[i]=clampByte(gray+(r-gray)*s); d[i+1]=clampByte(gray+(g-gray)*s); d[i+2]=clampByte(gray+(bl-gray)*s);
        }
        ex2.putImageData(im,0,0);
      }catch(e){}
    }
    ex.toBlob(function(blob){
      if(!blob){ toast('Capture failed'); return; }
      var rec={ id: stamp()+'-'+(seq++), ts: Date.now(), blob: blob };
      sPut(rec).then(function(){ shotCount++; updateBadge(); toast('Captured ('+shotCount+')'); })
               .catch(function(){ toast('Could not store capture'); });
    }, 'image/jpeg', 0.95);
  }

  // ===== gallery =====
  function clearGalUrls(){ galUrls.forEach(function(u){ URL.revokeObjectURL(u); }); galUrls=[]; }
  async function openGallery(){
    var shots = await sAll(); shots.sort(function(a,b){ return b.ts-a.ts; });
    var grid=document.getElementById('galGrid'); grid.innerHTML=''; clearGalUrls();
    if(!shots.length){
      var p=document.createElement('p'); p.className='galempty';
      p.textContent='No captures yet. Tap Snapshot while you work — shots collect here, then save them to Photos when you can reach the iPad.';
      grid.appendChild(p);
    } else {
      shots.forEach(function(sh){
        var url=URL.createObjectURL(sh.blob); galUrls.push(url);
        var btn=document.createElement('button'); btn.className='thumb';
        var img=document.createElement('img'); img.src=url; img.loading='lazy'; btn.appendChild(img);
        btn.onclick=function(){ openViewer(sh,url); };
        grid.appendChild(btn);
      });
    }
    shotCount=shots.length; updateBadge();
    document.getElementById('galTitle').textContent = shots.length ? 'Captures ('+shots.length+')' : 'Captures';
    document.getElementById('gallery').classList.add('open');
  }
  function closeGallery(){ document.getElementById('gallery').classList.remove('open'); clearGalUrls(); }

  function openViewer(sh,url){ curShot=sh; document.getElementById('viewerImg').src=url; document.getElementById('viewer').classList.add('open'); }
  function closeViewer(){ document.getElementById('viewer').classList.remove('open'); curShot=null; }

  async function shareFiles(files){
    if(navigator.canShare && navigator.canShare({files:files})){
      try{ await navigator.share({files:files}); return true; }
      catch(e){ if(e && e.name==='AbortError') return true; }
    }
    toast('Long-press an image to save it to Photos');
    return false;
  }

  document.getElementById('galBtn').onclick = openGallery;
  document.getElementById('galBack').onclick = closeGallery;
  document.getElementById('vBack').onclick = closeViewer;

  document.getElementById('vSave').onclick = async function(){
    if(!curShot) return;
    await shareFiles([ new File([curShot.blob], curShot.id+'.jpg', {type:'image/jpeg'}) ]);
  };
  document.getElementById('vDelete').onclick = async function(){
    if(!curShot) return;
    await sDel(curShot.id); closeViewer(); openGallery();
  };
  document.getElementById('saveAll').onclick = async function(){
    var shots = await sAll();
    if(!shots.length){ toast('Nothing to save'); return; }
    shots.sort(function(a,b){ return a.ts-b.ts; });
    var files = shots.map(function(sh){ return new File([sh.blob], sh.id+'.jpg', {type:'image/jpeg'}); });
    await shareFiles(files);
  };
  document.getElementById('clearAll').onclick = async function(){
    var lbl = document.querySelector('#clearAll .lbl');
    var shots = await sAll(); if(!shots.length){ return; }
    if(clearAllArmed){ clearAllArmed=false; if(lbl) lbl.textContent='Clear'; await sClear(); openGallery(); toast('Cleared'); return; }
    clearAllArmed=true; if(lbl) lbl.textContent='Sure?';
    setTimeout(function(){ clearAllArmed=false; if(lbl) lbl.textContent='Clear'; }, 2500);
  };
  var clearAllArmed=false;

  // ===== live controls =====
  document.getElementById('startBtn').onclick = startFlow;
  camSel.onchange = function(){ state.deviceId = camSel.value; save(); open(state.deviceId).catch(function(e){ toast(describeErr(e)); }); };
  document.getElementById('rotBtn').onclick = function(){ state.rot = (state.rot + 90) % 360; save(); };
  var mirBtn=document.getElementById('mirBtn');
  function reflectMir(){ mirBtn.classList.toggle('on', state.mir); }
  mirBtn.onclick = function(){ state.mir = !state.mir; save(); reflectMir(); };
  reflectMir();

  var adjust=document.getElementById('adjust'), adjBtn=document.getElementById('adjBtn');
  function bindSlider(id){
    var el=document.getElementById(id), lab=document.getElementById(id+'V');
    el.value = state[id]; lab.textContent = state[id]+'%';
    el.oninput=function(){ state[id]=+el.value; lab.textContent=el.value+'%'; applyAdjust(); save(); };
  }
  ['bri','con','sat'].forEach(bindSlider);
  adjBtn.onclick=function(){ var o=adjust.classList.toggle('open'); adjBtn.classList.toggle('on',o); };
  document.getElementById('resetAdj').onclick=function(){
    state.bri=100;state.con=100;state.sat=100;save();applyAdjust();
    ['bri','con','sat'].forEach(function(id){ document.getElementById(id).value=100; document.getElementById(id+'V').textContent='100%'; });
  };
  document.getElementById('snapBtn').onclick = snapshot;

  // Hardware shutter: a BT remote/footswitch (keyboard mode) sends a keypress.
  // During viewing there's no typing, so any hardware key is treated as a shutter.
  var lastKeyShot = 0;
  window.addEventListener('keydown', function(e){
    if(!running) return;
    if(document.getElementById('gallery').classList.contains('open') || document.getElementById('viewer').classList.contains('open')) return;
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if(tag==='input' || tag==='select' || tag==='textarea') return;
    if(e.key==='Shift' || e.key==='Control' || e.key==='Alt' || e.key==='Meta') return;
    var now = Date.now(); if(now - lastKeyShot < 700) return; lastKeyShot = now;
    e.preventDefault(); snapshot();
  });

  applyAdjust();
  updateBadge();
})();
</script>
</body>
</html>
